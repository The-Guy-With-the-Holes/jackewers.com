<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Game | Jack Ewers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            animation: fadeIn 0.7s ease-in;
        }

        .coin-container {
            perspective: 1000px;
            margin: 3rem auto;
            width: 250px;
            height: 250px;
        }

        .coin {
            width: 250px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }

        .coin.flipping {
            animation: flip 1s ease-in-out;
            cursor: grabbing;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6rem;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 8px solid rgba(255, 255, 255, 0.3);
        }

        .heads {
            background: linear-gradient(145deg, #f6d365 0%, #fda085 100%);
            color: #8B4513;
        }

        .tails {
            background: linear-gradient(145deg, #a8edea 0%, #fed6e3 100%);
            color: #4A5568;
            transform: rotateY(180deg);
        }

        @keyframes flip {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(1800deg);
            }
        }

        @keyframes flipHeads {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(1800deg);
            }
        }

        @keyframes flipTails {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(1980deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .controls {
            margin-top: 3rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 0.9s ease-in;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-flip {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #fff;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 1.1s ease-in;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .result-message {
            margin-top: 2rem;
            font-size: 1.8rem;
            font-weight: bold;
            min-height: 2.5rem;
            animation: bounce 0.5s ease;
        }

        .result-message.show {
            animation: bounce 0.5s ease;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffd700;
            position: absolute;
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .coin-container {
                width: 200px;
                height: 200px;
            }

            .coin {
                width: 200px;
                height: 200px;
            }

            .coin-face {
                font-size: 4.5rem;
            }

            .btn {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
        }

        .streak-indicator {
            margin-top: 1.5rem;
            font-size: 1rem;
            opacity: 0.9;
        }

        .streak-indicator.hot {
            color: #fda085;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.9;
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 Coin Flip</h1>
        <p class="subtitle">Click the coin or press the button!</p>

        <div class="coin-container">
            <div class="coin" id="coin" onclick="flipCoin()">
                <div class="coin-face heads">H</div>
                <div class="coin-face tails">T</div>
            </div>
        </div>

        <div class="result-message" id="result"></div>
        <div class="streak-indicator" id="streak"></div>

        <div class="controls">
            <button class="btn btn-flip" id="flipBtn" onclick="flipCoin()">
                🎲 Flip Coin
            </button>
            <button class="btn btn-reset" onclick="resetStats()">
                🔄 Reset Stats
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Flips</div>
                <div class="stat-value" id="totalFlips">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Heads</div>
                <div class="stat-value" id="headsCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tails</div>
                <div class="stat-value" id="tailsCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Heads %</div>
                <div class="stat-value" id="headsPercent">0%</div>
            </div>
        </div>
    </div>

    <script>
        let stats = {
            total: 0,
            heads: 0,
            tails: 0,
            streak: 0,
            lastResult: null
        };

        // Load stats from localStorage
        function loadStats() {
            const saved = localStorage.getItem('coinFlipStats');
            if (saved) {
                stats = JSON.parse(saved);
                updateStatsDisplay();
            }
        }

        // Save stats to localStorage
        function saveStats() {
            localStorage.setItem('coinFlipStats', JSON.stringify(stats));
        }

        function flipCoin() {
            const coin = document.getElementById('coin');
            const flipBtn = document.getElementById('flipBtn');
            const result = document.getElementById('result');
            
            // Prevent flipping while already flipping
            if (coin.classList.contains('flipping')) return;

            // Disable button during flip
            flipBtn.disabled = true;
            coin.style.cursor = 'grabbing';
            
            // Random result
            const isHeads = Math.random() < 0.5;
            
            // Remove old animation
            coin.classList.remove('flipping');
            void coin.offsetWidth; // Force reflow
            
            // Add appropriate animation
            if (isHeads) {
                coin.style.animation = 'flipHeads 1s ease-in-out';
            } else {
                coin.style.animation = 'flipTails 1s ease-in-out';
            }
            
            coin.classList.add('flipping');
            
            // Clear result during flip
            result.textContent = '';
            result.classList.remove('show');

            // Show result after animation
            setTimeout(() => {
                const resultText = isHeads ? '🎉 HEADS!' : '✨ TAILS!';
                result.textContent = resultText;
                result.classList.add('show');
                
                // Update stats
                stats.total++;
                if (isHeads) {
                    stats.heads++;
                } else {
                    stats.tails++;
                }

                // Update streak
                if (stats.lastResult === null) {
                    stats.streak = 1;
                } else if (stats.lastResult === isHeads) {
                    stats.streak++;
                } else {
                    stats.streak = 1;
                }
                stats.lastResult = isHeads;

                updateStatsDisplay();
                updateStreakDisplay();
                saveStats();
                
                // Add confetti effect for streaks
                if (stats.streak >= 5) {
                    createConfetti();
                }

                // Reset animation
                coin.classList.remove('flipping');
                coin.style.animation = '';
                coin.style.cursor = 'grab';
                flipBtn.disabled = false;

                // Set final rotation
                if (isHeads) {
                    coin.style.transform = 'rotateY(0deg)';
                } else {
                    coin.style.transform = 'rotateY(180deg)';
                }
            }, 1000);
        }

        function updateStatsDisplay() {
            document.getElementById('totalFlips').textContent = stats.total;
            document.getElementById('headsCount').textContent = stats.heads;
            document.getElementById('tailsCount').textContent = stats.tails;
            
            const headsPercent = stats.total > 0 
                ? Math.round((stats.heads / stats.total) * 100) 
                : 0;
            document.getElementById('headsPercent').textContent = headsPercent + '%';
        }

        function updateStreakDisplay() {
            const streakElement = document.getElementById('streak');
            if (stats.streak >= 3) {
                const resultName = stats.lastResult ? 'Heads' : 'Tails';
                streakElement.textContent = `🔥 ${stats.streak}x ${resultName} streak!`;
                if (stats.streak >= 5) {
                    streakElement.classList.add('hot');
                }
            } else {
                streakElement.textContent = '';
                streakElement.classList.remove('hot');
            }
        }

        function resetStats() {
            if (confirm('Reset all statistics?')) {
                stats = {
                    total: 0,
                    heads: 0,
                    tails: 0,
                    streak: 0,
                    lastResult: null
                };
                updateStatsDisplay();
                updateStreakDisplay();
                saveStats();
                document.getElementById('result').textContent = '';
                document.getElementById('coin').style.transform = 'rotateY(0deg)';
            }
        }

        function createConfetti() {
            const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                flipCoin();
            } else if (e.code === 'KeyR' && e.ctrlKey) {
                e.preventDefault();
                resetStats();
            }
        });

        // Load stats on page load
        loadStats();
    </script>
</body>
</html>
