<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Days of Code Challenge | Jack Ewers</title>
    <meta name="description" content="Follow my 100 Days of Code journey - daily coding projects, learning milestones, and development progress.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="https://media.bloodweb.net/jackewers/branding/icon/Favicon.png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/shared/assets/styles/nav.css">
    <link rel="stylesheet" href="/shared/assets/styles/styles.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="100 Days of Code Challenge | Jack Ewers">
    <meta property="og:description" content="Follow my 100 Days of Code journey - daily coding projects and learning milestones.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jackewers.com/app/100-days-of-code/">
    <!-- Resolve theme before first paint (avoids flash of wrong theme) -->
    <script src="/shared/assets/scripts/early-theme.js"></script>
</head>
<body>
    
    <!-- Hero Image Header -->
    <div class="hero-image-container">
        <img 
            src="https://media.bloodweb.net/jackewers/branding/banner/banner-img-light.webp" 
            alt="Jack Ewers - Software Developer"
            class="hero-image"
            onerror="this.src='https://media.bloodweb.net/jackewers/images/headshot.jpg'"
        >
        <div class="hero-image-overlay"></div>
    </div>
    
    <!-- Navigation Component -->
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="nav-placeholder" class="nav-skeleton"></div>

    <!-- Header Section -->
    <header class="hero-section" id="main-content">
        <div class="hero-content">
            <h1 class="hero-title">100 Days of Code</h1>
            <img src="images/banner.png" alt="100 Days of Code Banner" class="hero-image">
            <p class="hero-subtitle">
                Join me on my journey to code for 100 days straight!<br>
                Documenting daily projects, challenges, and learning milestones.
            </p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
                <span class="progress-text" id="progressText">Day 3 of 100</span>
            </div>
            
            <!-- Countdown Tracker -->
            <div class="countdown-tracker" id="countdownTracker">
                <div class="tracker-label">Next:</div>
                <div class="countdown-time" id="countdownTime">--:--:--</div>
                <div class="schedule-status" id="scheduleStatus">On Track</div>
                <button class="alert-button hidden" id="alertButton" onclick="sendBehindAlert()">🔔 Alert Jack!</button>
            </div>
        </div>
    </header>

    <!-- Timeline Container -->
    <main class="timeline-container">
        <div class="timeline">
            <!-- Center Line -->
            <div class="timeline-line"></div>
            
            <!-- Day entries will be generated by JavaScript -->
            <div id="timelineEntries"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 Jack Ewers. Building skills one day at a time.</p>
            <div class="social-links">
                <a href="https://github.com/The-Guy-With-the-Holes" target="_blank" rel="noopener">GitHub</a>
                <a href="https://linkedin.com/in/jackewers" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://twitter.com/jackewers" target="_blank" rel="noopener">Twitter</a>
            </div>
        </div>
    </footer>

    <!-- Go to Top/Recent Button -->
    <button class="go-to-top" id="goToTop" aria-label="Go to top">
        <i class="fas fa-arrow-up" id="goToTopIcon"></i>
    </button>

    <!-- Scripts -->
    <script src="/shared/assets/scripts/load-navbar.js"></script>
    <script src="/shared/assets/scripts/theme.js"></script>
    <script src="/shared/assets/scripts/nav.js"></script>
    <script src="script.js"></script>
    <script>
        // Dual function button: Go to top OR go to most recent
        const goToTopBtn = document.getElementById('goToTop');
        const goToTopIcon = document.getElementById('goToTopIcon');
        let isAtTop = true;
        
        function updateButtonState() {
            if (window.scrollY > 300) {
                goToTopBtn.classList.add('visible');
                goToTopIcon.className = 'fas fa-arrow-up';
                goToTopBtn.setAttribute('aria-label', 'Go to top');
                isAtTop = false;
            } else {
                // At top - show "go to recent" function
                if (document.querySelector('.day-card.completed')) {
                    goToTopBtn.classList.add('visible');
                    goToTopIcon.className = 'fas fa-clock';
                    goToTopBtn.setAttribute('aria-label', 'Go to most recent');
                    isAtTop = true;
                } else {
                    goToTopBtn.classList.remove('visible');
                }
            }
        }
        
        window.addEventListener('scroll', updateButtonState);
        
        // Run on page load after content is loaded
        window.addEventListener('load', () => {
            setTimeout(updateButtonState, 100);
        });
        
        goToTopBtn.addEventListener('click', () => {
            if (isAtTop) {
                // Find the most recent completed project
                const completedCards = Array.from(document.querySelectorAll('.day-card.completed'));
                if (completedCards.length > 0) {
                    // Get the last completed card (most recent)
                    const mostRecent = completedCards[completedCards.length - 1];
                    mostRecent.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            } else {
                // Scroll to top
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }
        });
    </script>
</body>
</html>
