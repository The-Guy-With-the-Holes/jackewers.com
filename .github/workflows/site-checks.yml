name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML5
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          extra: >-
            --blacklist components
            --ignore-re "email-signatures/.*"
            "is not a .color-stop. value"
            "is not a .background-clip. value"
            "Property .backdrop-filter. doesn.t exist"
            "Property .color-scheme. doesn.t exist"
            "too few values for the property .linear-gradient."
            ".min-height.: Unknown dimension"

  lint-js:
    name: JS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No package.json by design - this is a no-build static site, so the
      # linter is installed ad hoc rather than becoming a project dependency.
      - name: Install ESLint
        run: npm install --no-save --no-fund --no-audit eslint@9 globals
      - name: Lint
        run: npx eslint .

  structure:
    name: Structural check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Covers what the other jobs can't: dead-end pages, <script src> targets
      # (lychee ignores those), and orphaned files under shared/assets/.
      - name: Check structure
        run: python3 .github/scripts/check-structure.py

  broken-links:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir .
            --accept "200..=299, 429"
            --exclude-path email-signatures
            --exclude 'linkedin\.com'
            --exclude 'instagram\.com'
            --exclude 'facebook\.com'
            .
          fail: true
