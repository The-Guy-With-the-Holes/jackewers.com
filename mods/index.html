<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This page moved to /about/body-mod/. GitHub Pages cannot serve a 301,
         so this is the static-host equivalent: an instant meta refresh plus a
         canonical pointing at the new URL. Google treats a 0-second refresh as
         a permanent redirect and consolidates the ranking signals.
         Deliberately NOT noindex — that would contradict the canonical and
         risk dropping the page before its signals transfer. -->
    <link rel="canonical" href="https://jackewers.com/about/body-mod/">
    <meta http-equiv="refresh" content="0; url=https://jackewers.com/about/body-mod/">

    <title>Body Modifications | Jack Ewers</title>
    <meta name="description"
        content="Body Modification Journey - Jack Ewers. 20+ years of experience with piercings, scarification, sclera staining, subdermal implants, and more.">

    <meta property="og:title" content="Body Modifications | Jack Ewers">
    <meta property="og:description"
        content="20+ years of body modification experience - sclera staining, subdermal implants, bifurcated tongue, and more">
    <meta property="og:url" content="https://jackewers.com/about/body-mod/">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: Inter, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            text-align: center;
            line-height: 1.6;
        }

        a {
            color: #6366f1;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main>
        <h1>This page has moved</h1>
        <p>
            My body modification journey now lives at
            <a href="/about/body-mod/">jackewers.com/about/body-mod/</a>.
        </p>
        <p>Redirecting you now&hellip;</p>
    </main>

    <!-- Fallback for browsers that ignore meta refresh. replace() keeps the
         retired URL out of the back-button history. -->
    <script>
        location.replace('/about/body-mod/');
    </script>
</body>

</html>
